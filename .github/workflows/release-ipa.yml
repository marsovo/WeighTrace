name: Release IPA

# Layout: the project lives in the weighrace-b1/ subfolder of this repo.
# Builds the iOS device app unsigned and packages the IPA as an artifact
# for sideload re-signing (LiveContainer / SideStore).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Check trends and backup data
        working-directory: weighrace-b1
        run: bash scripts/check-trends-backup.sh

      - name: Build iOS device app (unsigned)
        run: >
          xcodebuild
          -project "weighrace-b1/体脂秤.xcodeproj"
          -scheme "体脂秤"
          -configuration Release
          -destination "generic/platform=iOS"
          -derivedDataPath "$RUNNER_TEMP/DerivedData-IPA"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData-IPA/Build/Products/Release-iphoneos/WeighTrace.app"
          test -d "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")
          NAME="WeighTrace-B1-patched-${VERSION}-${BUILD}.ipa"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/Payload"
          cp -a "$APP" "$STAGE/Payload/"
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/$NAME" Payload)
          echo "ipa_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "### IPA built" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`$NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -h "$GITHUB_WORKSPACE/$NAME" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ipa_name }}
          path: ${{ steps.package.outputs.ipa_name }}
          retention-days: 90
